name: Deploy to Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy-backend-staging:
    name: Deploy Backend to Railway (Staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://trading-platform-api-staging.railway.app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}
        run: |
          railway link ${{ secrets.RAILWAY_STAGING_PROJECT_ID }}
          railway up --service backend --environment staging

      - name: Wait for deployment
        run: sleep 30

      - name: Health check
        run: |
          curl -f https://trading-platform-api-staging.railway.app/health || exit 1

  deploy-frontend-staging:
    name: Deploy Frontend to Vercel (Staging)
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://trading-platform-staging.vercel.app
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Deploy to Vercel Staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd frontend
          vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
          vercel build --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --token=$VERCEL_TOKEN > deployment-url.txt
          cat deployment-url.txt

      - name: Wait for deployment
        run: sleep 20

      - name: Health check
        run: |
          DEPLOYMENT_URL=$(cat frontend/deployment-url.txt)
          curl -f $DEPLOYMENT_URL || exit 1

  run-smoke-tests:
    name: Run Smoke Tests on Staging
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-frontend-staging]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run smoke tests
        env:
          STAGING_API_URL: https://trading-platform-api-staging.railway.app
          STAGING_FRONTEND_URL: https://trading-platform-staging.vercel.app
        run: |
          pytest tests/smoke/ -v || echo "No smoke tests yet"

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-backend-staging, deploy-frontend-staging, run-smoke-tests]
    if: always()
    
    steps:
      - name: Send Slack notification
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Staging Deployment ${{ needs.run-smoke-tests.result }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Staging Deployment Status*\n\nBackend: ${{ needs.deploy-backend-staging.result }}\nFrontend: ${{ needs.deploy-frontend-staging.result }}\nSmoke Tests: ${{ needs.run-smoke-tests.result }}\n\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Workflow Run>"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
